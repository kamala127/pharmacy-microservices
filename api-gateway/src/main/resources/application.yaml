server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
        - id: medicine-service
          uri: http://localhost:8082
          predicates:
            - Path=/medicine/**
          filters:
            - StripPrefix=1